name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p speakapp-server --release
      - run: cargo test -p speakapp-shared

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Typecheck + Vite build
        run: npm run build
      - name: Verify Electron entrypoints
        run: |
          test -f electron/main.mjs
          test -f electron/preload.cjs
          test -f electron-builder.yml

  docker-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build arm64 API image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f deploy/Dockerfile.api \
            -t speakapp-api:arm64 \
            --load \
            .
        continue-on-error: true
